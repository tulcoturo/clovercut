format = 2

[effect]
id = "concat.subject-neon"
name = "Subject Neon"
kind = "effect"
category = "Subject"
shelves = ["Featured"]
order = 10
intensity = "amount"
description = "An animated neon outline and soft glow around the analysed person, keeping the original background."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 200
default = 80
step = 1
unit = "%"
animate = true

[[param]]
key = "width"
label = "Width"
min = 0.2
max = 6
default = 1.2
step = 0.1
unit = "%"
animate = true

[[param]]
key = "hue"
label = "Hue"
min = 0
max = 360
default = 190
step = 1
unit = "°"
animate = true

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 4
default = 1
step = 0.1
animate = true

[wgsl]
entry = "effect.wgsl"

[card]
moment = 0.7
