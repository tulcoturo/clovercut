format = 2

[effect]
id = "concat.camera-shake"
name = "Camera Shake"
kind = "effect"
category = "Distort"
shelves = ["Featured"]
order = 80
intensity = "amount"
description = "Smooth handheld movement with automatic overscan to keep frame edges covered."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 35
step = 1
unit = "%"
animate = true

[[param]]
key = "speed"
label = "Speed"
min = 0.1
max = 5
default = 1.4
step = 0.1
unit = ""
animate = true

[[param]]
key = "rotation"
label = "Rotation"
min = 0
max = 3
default = 0.7
step = 0.1
unit = "\u00b0"
animate = true

[wgsl]
entry = "effect.wgsl"

[card]
moment = 0.7
