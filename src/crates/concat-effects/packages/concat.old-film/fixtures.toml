[[probe]]
name = "default, black stays black"
at = "default"
input = [0, 0, 0, 1]
expect = [0, 0, 0, 1]

[[probe]]
name = "min, black stays black"
at = "min"
input = [0, 0, 0, 1]
expect = [0, 0, 0, 1]

[[probe]]
name = "max, black stays black"
at = "max"
input = [0, 0, 0, 1]
expect = [0, 0, 0, 1]

[[probe]]
name = "zero amount preserves extended light and alpha"
params = { amount = 0 }
input = [4, 1, 0.05, 0.5]
expect = [4, 1, 0.05, 0.5]

[[probe]]
name = "unworn tint keeps extended neutral light"
params = { amount = 100, grain = 0, wear = 0 }
input = [2, 2, 2, 0.5]
expect = [2.24, 2, 1.56, 0.5]

[[probe]]
name = "transparent black stays transparent"
input = [0, 0, 0, 0]
expect = [0, 0, 0, 0]
