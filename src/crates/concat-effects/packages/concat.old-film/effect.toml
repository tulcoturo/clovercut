format = 2

[effect]
id = "concat.old-film"
name = "Old Film"
kind = "effect"
category = "Retro"
shelves = ["Featured"]
order = 88
intensity = "amount"
description = "Warm faded film, moving grain, projector flicker, dust and fine vertical scratches."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 65
step = 1
unit = "%"
animate = true

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 30
step = 1
unit = "%"
animate = true

[[param]]
key = "wear"
label = "Film wear"
min = 0
max = 100
default = 35
step = 1
unit = "%"
animate = true

[[param]]
key = "speed"
label = "Speed"
min = 1
max = 30
default = 18
step = 1
unit = "fps"
animate = true

[wgsl]
entry = "effect.wgsl"

[card]
moment = 0.7
