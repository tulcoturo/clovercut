# Spatial probes use the catalogue/CLI canonical 8x8 target (centre UV 0.5625).
[[probe]]
name = "default, flare lifts opaque black"
at = "default"
input = [0, 0, 0, 1]
expect = [0.01258727747216914, 0.0038461125609405705, 0.0008391518314779426, 1]

[[probe]]
name = "min, black stays black"
at = "min"
input = [0, 0, 0, 1]
expect = [0, 0, 0, 1]

[[probe]]
name = "max, flare lifts opaque black"
at = "max"
input = [0, 0, 0, 1]
expect = [0.2870691537814667, 0.08771557476655926, 0.01913794358543111, 1]

[[probe]]
name = "zero amount preserves extended light and alpha"
params = { amount = 0 }
input = [4, 1, 0.05, 0.5]
expect = [4, 1, 0.05, 0.5]

[[probe]]
name = "transparent black stays transparent"
input = [0, 0, 0, 0]
expect = [0, 0, 0, 0]
