# Desktop packages for Linux, Windows x64/ARM64 and macOS. Native dependencies remain checksum-pinned in scripts/ci/deps.lock.
name: Build Clovercut packages
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: main
      desktop_target:
        description: Desktop package to validate (all for a release)
        type: choice
        default: all
        options: [all, linux-x86_64, linux-aarch64, windows-x86_64, windows-aarch64, macos-arm64, macos-x86_64]
      include_mobile:
        description: Also build Android (desktop releases leave this disabled)
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: The ref to build, when it is not the one this runs on
        type: string
        default: ''
      desktop_target:
        type: string
        default: all
      include_mobile:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  ORT_VERSION: 1.28.0
  GGML_NATIVE: 'OFF'
jobs:
  plan:
    name: Select desktop packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_matrix: ${{ steps.matrix.outputs.app_matrix }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      macos_matrix: ${{ steps.matrix.outputs.macos_matrix }}
      run_app: ${{ steps.matrix.outputs.run_app }}
      run_windows: ${{ steps.matrix.outputs.run_windows }}
      run_macos: ${{ steps.matrix.outputs.run_macos }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - id: matrix
      env:
        DESKTOP_TARGET: ${{ inputs.desktop_target || 'all' }}
      run: python3 scripts/ci/select-desktop-targets.py --target "$DESKTOP_TARGET" --github-output "$GITHUB_OUTPUT"
  app:
    needs: plan
    if: needs.plan.outputs.run_app == 'true'
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.app_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190
    env:
      GGML_BACKEND_DL: ${{ matrix.ggml == 'variants' && 'ON' || 'OFF' }}
      GGML_CPU_ALL_VARIANTS: ${{ matrix.ggml == 'variants' && 'ON' || 'OFF' }}
      GGML_AVX2: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_FMA: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_F16C: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_BMI2: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref }}
    - name: The pinned toolchain
      id: toolchain
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
    - name: Read the version
      id: version
      shell: bash
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Building Clovercut $version for ${{ matrix.target }}"
    - name: System libraries (Linux)
      timeout-minutes: 5
      run: |
        sudo sed -i 's/#\$nrconf{restart} = .*/$nrconf{restart} = "a";/g' /etc/needrestart/needrestart.conf 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
          libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
          libgtk-3-dev libasound2-dev libclang-dev cmake libxkbcommon-x11-0
    - name: FFmpeg development libraries (Linux)
      run: |
        set -euo pipefail
        scripts/ci/fetch.sh "ffmpeg-${{ matrix.ffmpeg }}" ffmpeg.tar.xz
        mkdir -p ffmpeg-dev
        tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
        {
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev"
          echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib"
          # The shipped binary finds the libraries beside itself, in lib/.
          # --disable-new-dtags makes that an old-style DT_RPATH, which is
          # consulted for *every* object in the process - DT_RUNPATH is
          # not transitive, so libavformat's own load of libavcodec would
          # ignore it and the staged binary would not stand alone.
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,\$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        } >> "$GITHUB_ENV"
    - name: ONNX Runtime (Linux)
      run: |
        set -euo pipefail
        stem="onnxruntime-linux-${{ matrix.ort }}-$ORT_VERSION"
        scripts/ci/fetch.sh "onnxruntime-linux-${{ matrix.ort }}" onnxruntime.tgz
        tar -xzf onnxruntime.tgz
        test -f "$stem/lib/libonnxruntime.so.$ORT_VERSION"
        # The tarball carries the soname and the full version; the linker
        # asks for the bare name.
        ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
        {
          echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
          echo "ORT_PREFER_DYNAMIC_LINK=1"
          echo "ORT_DIR=$PWD/$stem"
        } >> "$GITHUB_ENV"
    - name: sherpa-onnx static libraries (Linux)
      shell: bash
      run: |
        set -euo pipefail
        version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
        name="sherpa-onnx-${{ matrix.sherpa }}-static-lib"
        case "$(scripts/ci/fetch.sh --url "$name")" in
          */v"$version"/*) ;;
          *) echo "scripts/ci/deps.lock pins $name for another version than Cargo.lock's $version" >&2; exit 1 ;;
        esac
        stem="sherpa-onnx-v$version-${{ matrix.sherpa }}-static-lib"
        scripts/ci/fetch.sh "$name" sherpa.tar.bz2
        mkdir -p sherpa
        tar -xjf sherpa.tar.bz2 -C sherpa
        test -d "sherpa/$stem/lib"
        echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: src
        cache-on-failure: true
        key: ${{ matrix.target }}
        env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT
    - name: Memory headroom for the generated Linux UI
      run: |
        set -euo pipefail
        # Keep the runner alive while rustc processes Slint's large module.
        # A single Cargo job does not bound one compiler process's memory.
        sudo fallocate -l 8G /swapfile-clovercut
        sudo chmod 600 /swapfile-clovercut
        sudo mkswap /swapfile-clovercut
        sudo swapon /swapfile-clovercut
        free -h
    - name: Build
      timeout-minutes: 120
      shell: bash
      working-directory: src
      run: |
        set -o pipefail
        # The engine stays at opt-level 3. Optimising the generated UI and
        # fat-linking the whole dependency graph exhausts hosted Linux runners.
        /usr/bin/time -v cargo build --locked --profile app -p concat --bin clovercut \
          --target ${{ matrix.target }} \
          --config 'profile.app.lto=false' \
          --config 'profile.app.package.concat.opt-level=0' \
          --config 'profile.app.package.concat.codegen-units=16' 2>&1 | tee build.log
    - name: Build log to the summary (failure only)
      if: failure()
      shell: bash
      run: |
        if [ -f src/build.log ]; then
          {
            echo "### Build failed: ${{ matrix.target }}"
            echo '```'
            tail -n 150 src/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Stage (Linux)
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        name="Clovercut-${VERSION}-linux-${{ matrix.arch }}"
        mkdir -p "stage/$name/lib"
        cp "src/target/${{ matrix.target }}/app/clovercut" "stage/$name/clovercut"
        cp -a ffmpeg-dev/lib/*.so* "stage/$name/lib/"
        cp -a "$ORT_DIR"/lib/libonnxruntime.so* "stage/$name/lib/"
        # whisper's shared libraries and its CPU modules, one per x86_64
        # generation (the job's `env` says why), from where whisper-rs-sys
        # installed them: libraries in lib/, modules in bin/. Its build
        # also copies them beside the binary, for `cargo run`, but a build
        # the cache satisfied does not run that script again, and the
        # cache does not promise to keep loose files at the top of a
        # profile. In lib/ the rpath finds the libraries and
        # concat-speech's `cpu_backend` the modules.
        if [ "${{ matrix.ggml }}" = variants ]; then
          out=$(ls -dt "src/target/${{ matrix.target }}/app/build"/whisper-rs-sys-*/out/bin | head -1)
          out=${out%/bin}
          echo "whisper's build: $out"
          cp -a "$out"/lib*/libwhisper.so* "$out"/lib*/libggml*.so* "$out"/bin/libggml-cpu-*.so "stage/$name/lib/"
          for module in x64 sandybridge haswell; do
            test -f "stage/$name/lib/libggml-cpu-$module.so" \
              || { echo "libggml-cpu-$module.so is missing from the build" >&2; exit 1; }
          done
        fi
        cp assets/icons/clovercut_256.png "stage/$name/clovercut.png"
        cp assets/linux/io.github.tulcoturo.clovercut.desktop "stage/$name/"
        cp LICENSE THIRD_PARTY_NOTICES.md "stage/$name/"
        # The binary must resolve every library from the folder alone.
        # The whole ldd report goes to the public summary when it does
        # not, so the failure names the library instead of just a step.
        report=$(env -u LD_LIBRARY_PATH ldd "stage/$name/clovercut" || true)
        if grep -i 'not found' <<<"$report"; then
          {
            echo "### Unresolved libraries: ${{ matrix.target }}"
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$report"
          echo "the binary does not resolve every library from its own folder" >&2
          exit 1
        fi
    - name: Smoke test (Linux)
      timeout-minutes: 15
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth strace libgl1-mesa-dri mesa-vulkan-drivers
        args=()
        if [ "${{ matrix.arch }}" = x86_64 ]; then
          scripts/ci/fetch.sh sde-lin sde.tar.xz
          mkdir -p sde
          tar -xJf sde.tar.xz -C sde --strip-components=1
          args+=(--sde "$PWD/sde/sde64")
        fi
        scripts/ci/smoke-linux.sh "${args[@]}" "stage/Clovercut-${VERSION}-linux-${{ matrix.arch }}"
    - name: Instruction-set scan (Linux x86_64)
      if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
      timeout-minutes: 15
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y llvm
        scripts/ci/isa-scan.sh "stage/Clovercut-${VERSION}-linux-${{ matrix.arch }}"
    - name: Package AppImage
      env:
        VERSION: ${{ steps.version.outputs.version }}
        ARCH: ${{ matrix.appimage }}
      run: |
        scripts/build-appimage.sh "stage/Clovercut-${VERSION}-linux-${{ matrix.arch }}" "$ARCH" "stage/Clovercut-${VERSION}-${{ matrix.arch }}.AppImage"
    - name: Package .deb and .rpm
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        chmod +x scripts/build-deb.sh scripts/build-rpm.sh
        ./scripts/build-deb.sh "stage/Clovercut-${VERSION}-linux-${{ matrix.arch }}" "$VERSION" "stage/Clovercut-${VERSION}-${{ matrix.arch }}.deb"
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y rpm
        ./scripts/build-rpm.sh "stage/Clovercut-${VERSION}-linux-${{ matrix.arch }}" "$VERSION" "stage/Clovercut-${VERSION}-${{ matrix.arch }}.rpm"
        ls -l stage/
    - name: Smoke test in clean distributions (Linux)
      timeout-minutes: 25
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        for image in ubuntu:22.04 debian:12; do
          scripts/ci/smoke-linux.sh --container "$image" "stage/Clovercut-${VERSION}-${{ matrix.arch }}.AppImage"
        done
    - name: Install and launch native Linux packages
      timeout-minutes: 20
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        bash scripts/ci/smoke-native-linux.sh --container debian:12 "stage/Clovercut-${VERSION}-${{ matrix.arch }}.deb" "$VERSION"
        bash scripts/ci/smoke-native-linux.sh --container fedora:43 "stage/Clovercut-${VERSION}-${{ matrix.arch }}.rpm" "$VERSION"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: Clovercut-linux-${{ matrix.arch }}
        path: |-
          stage/*.AppImage
          stage/*.deb
          stage/*.rpm
        if-no-files-found: error

  windows:
    needs: plan
    if: needs.plan.outputs.run_windows == 'true'
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows_matrix) }}
    env:
      GGML_BACKEND_DL: ${{ matrix.ggml == 'variants' && 'ON' || 'OFF' }}
      GGML_CPU_ALL_VARIANTS: ${{ matrix.ggml == 'variants' && 'ON' || 'OFF' }}
      GGML_AVX2: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_FMA: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_F16C: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_BMI2: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref }}
    - name: The pinned toolchain
      id: toolchain
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
    - name: Read the version
      id: version
      shell: bash
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Building Clovercut $version for ${{ matrix.target }}"
    - name: FFmpeg development libraries and LLVM (Windows)
      if: matrix.platform == 'windows'
      timeout-minutes: 15
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $bash = "$env:ProgramFiles\Git\bin\bash.exe"
        & $bash scripts/ci/fetch.sh "llvm-${{ matrix.llvm }}" llvm.exe
        if ($LASTEXITCODE -ne 0) { throw "the LLVM download failed" }
        Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=C:\llvm"
        if (-not (Test-Path C:\llvm\bin\libclang.dll)) { throw "LLVM did not install to C:\llvm" }
        # The installer is not needed once LLVM is in place. On Windows on
        # ARM it can still hold its own file open after it returns, which
        # turned the deletion into the step's failure in v0.2.7-rc.1; a
        # left-over installer in the workspace harms nothing.
        Remove-Item llvm.exe -ErrorAction SilentlyContinue
        if ("${{ matrix.arch }}" -eq "aarch64") {
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXXFLAGS=-EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
        }
        "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        "LIBCLANG_PATH=C:\llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
        & $bash scripts/ci/fetch.sh "ffmpeg-${{ matrix.ffmpeg }}" ffmpeg-win.zip
        if ($LASTEXITCODE -ne 0) { throw "the FFmpeg download failed" }
        Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
        $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
        "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
        "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
    - name: ONNX Runtime (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci/fetch.sh "onnxruntime-${{ matrix.ort }}" onnxruntime.zip
        if ($LASTEXITCODE -ne 0) { throw "the ONNX Runtime download failed" }
        Expand-Archive onnxruntime.zip -DestinationPath .
        $dir = "$PWD\onnxruntime-${{ matrix.ort }}-$env:ORT_VERSION"
        if (-not (Test-Path "$dir\lib\onnxruntime.lib")) { throw "$dir\lib\onnxruntime.lib is not there" }
        if (-not (Test-Path "$dir\lib\onnxruntime.dll")) { throw "$dir\lib\onnxruntime.dll is not there" }
        "ORT_LIB_LOCATION=$dir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
        "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append
        "ORT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
        "$dir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append
    - name: sherpa-onnx shared libraries (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $version = (Select-String -Path src\Cargo.lock -Pattern 'name = "sherpa-onnx-sys"' -Context 0,1).Context.PostContext[0] -replace '.*"(.*)".*', '$1'
        $name = "sherpa-onnx-${{ matrix.sherpa }}-shared-MT-Release-lib"
        $stem = "sherpa-onnx-v$version-${{ matrix.sherpa }}-shared-MT-Release-lib"
        $bash = "$env:ProgramFiles\Git\bin\bash.exe"
        $url = & $bash scripts/ci/fetch.sh --url $name
        if ($url -notmatch "/v$([regex]::Escape($version))/") { throw "scripts/ci/deps.lock pins $name for another version than Cargo.lock's $version" }
        Write-Host "Downloading $stem"
        & $bash scripts/ci/fetch.sh $name sherpa.tar.bz2
        if ($LASTEXITCODE -ne 0) { throw "the sherpa-onnx download failed" }
        Write-Host "Unpacking"
        python -c "import tarfile; t = tarfile.open('sherpa.tar.bz2'); t.extractall(**({'filter': 'data'} if hasattr(tarfile, 'data_filter') else {}))"
        if (-not (Test-Path "$stem\lib")) { throw "$stem\lib is not there after unpacking" }
        New-Item -ItemType Directory -Force sherpa-libs, sherpa-dlls | Out-Null
        Copy-Item "$stem\lib\sherpa-onnx-*.lib" sherpa-libs\
        Copy-Item "$stem\lib\sherpa-onnx-*.dll" sherpa-dlls\
        "SHERPA_ONNX_LIB_DIR=$PWD\sherpa-libs" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SHERPA_DLL_DIR=$PWD\sherpa-dlls" | Out-File -FilePath $env:GITHUB_ENV -Append
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: src
        cache-on-failure: true
        key: ${{ matrix.target }}
        env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT
    - name: Build
      timeout-minutes: 90
      shell: bash
      working-directory: src
      run: |
        set -o pipefail
        cargo build --locked --profile app -p concat --bin clovercut --target ${{ matrix.target }} \
          --config 'profile.app.lto=false' \
          --config 'profile.app.package.concat.opt-level=0' \
          --config 'profile.app.package.concat.codegen-units=16' 2>&1 | tee build.log
    - name: Build log to the summary (failure only)
      if: failure()
      shell: bash
      run: |
        if [ -f src/build.log ]; then
          {
            echo "### Build failed: ${{ matrix.target }}"
            echo '```'
            tail -n 150 src/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Stage (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $ErrorActionPreference = "Stop"
        $name = "Clovercut-$env:VERSION-windows-${{ matrix.arch }}"
        $dir = "stage\$name"
        New-Item -ItemType Directory -Force $dir | Out-Null
        Copy-Item "src\target\${{ matrix.target }}\app\clovercut.exe" $dir
        Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $dir
        # The sherpa-onnx runtime, set aside by the download step above.
        Copy-Item "$env:SHERPA_DLL_DIR\*.dll" $dir
        Copy-Item "$env:ORT_DIR\lib\*.dll" $dir
        # whisper's DLLs and its CPU modules, one per x86_64 generation
        # (the job's `env` says why), from the bin\ whisper-rs-sys
        # installed them to; see the Linux stage for why not from beside
        # the program. Beside clovercut.exe Windows finds the DLLs and
        # concat-speech's `cpu_backend` the modules.
        if ("${{ matrix.ggml }}" -eq "variants") {
          $built = Get-ChildItem "src\target\${{ matrix.target }}\app\build\whisper-rs-sys-*\out\bin\ggml-cpu-x64.dll" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "whisper-rs-sys installed no ggml-cpu-x64.dll" }
          Write-Host "whisper's build: $($built.DirectoryName)"
          Copy-Item "$($built.DirectoryName)\whisper.dll", "$($built.DirectoryName)\ggml*.dll" $dir
          foreach ($module in "x64", "sandybridge", "haswell") {
            if (-not (Test-Path "$dir\ggml-cpu-$module.dll")) { throw "ggml-cpu-$module.dll is missing from the build" }
          }
        }
        Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $dir
        # The Visual C++ runtime DLLs anything in the folder imports, from
        # the newest redistributable folder Visual Studio carries.
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\${{ matrix.vc }}\Microsoft.VC14*.CRT" -Directory |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $crt) { throw "no Visual C++ redistributable folder for ${{ matrix.vc }} under $vs" }
        $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe" | Select-Object -First 1
        # Twice over: msvcp140.dll, once copied, imports vcruntime140.dll.
        foreach ($pass in 1, 2) {
          foreach ($pe in Get-ChildItem $dir -File -Include *.exe, *.dll -Recurse) {
            foreach ($line in & $dumpbin /nologo /dependents $pe.FullName) {
              $dll = $line.Trim()
              if ($dll -match "\.dll$" -and (Test-Path "$($crt.FullName)\$dll") -and -not (Test-Path "$dir\$dll")) {
                Write-Host "$($pe.Name) imports $dll; copying it from $($crt.FullName)"
                Copy-Item "$($crt.FullName)\$dll" $dir
              }
            }
          }
        }
        Get-ChildItem $dir | Format-Table Name, Length
    - name: Smoke test (Windows)
      if: matrix.platform == 'windows'
      timeout-minutes: 15
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: scripts/ci/smoke-windows.ps1 -Bundle "stage\Clovercut-$env:VERSION-windows-${{ matrix.arch }}"
    - name: Smoke test on an emulated Ivy Bridge (Windows x86_64)
      if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
      timeout-minutes: 30
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $ErrorActionPreference = "Stop"
        Write-Host "downloading SDE"
        & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci/fetch.sh sde-win sde.tar.xz
        if ($LASTEXITCODE -ne 0) { throw "the SDE download failed" }
        Write-Host "unpacking SDE"
        $7z = "$env:ProgramFiles\7-Zip\7z.exe"
        & $7z x -y sde.tar.xz | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "unpacking sde.tar.xz failed" }
        & $7z x -y -osde sde.tar | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "unpacking sde.tar failed" }
        $sde = (Get-ChildItem sde -Recurse -Filter sde.exe | Select-Object -First 1).FullName
        if (-not $sde) { throw "sde.exe is not in the archive" }
        Write-Host "SDE at $sde"
        scripts/ci/smoke-windows.ps1 -Bundle "stage\Clovercut-$env:VERSION-windows-x86_64" -Sde $sde
    - name: Instruction-set scan (Windows x86_64)
      if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
      timeout-minutes: 15
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: scripts/ci/isa-scan.sh "stage/Clovercut-${VERSION}-windows-${{ matrix.arch }}"
    - name: Windows installer and portable archive
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $ErrorActionPreference = "Stop"
        $name = "Clovercut-$env:VERSION-windows-${{ matrix.arch }}"
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
        }
        if (-not (Test-Path $iscc)) { throw "Inno Setup is not at $iscc" }
        & $iscc "/DVersion=$env:VERSION" "/DArch=${{ matrix.inno }}" "/DSuffix=${{ matrix.arch }}" `
          "/DStage=$PWD\stage\$name" "/DOut=$PWD\stage" assets\windows\clovercut.iss
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
        if (-not (Test-Path "stage\$name-setup.exe")) { throw "installer missing" }
        Compress-Archive -Path "stage\$name" -DestinationPath "stage\$name-portable.zip"
        Remove-Item -Recurse -Force "stage\$name"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: Clovercut-windows-${{ matrix.arch }}
        path: |-
          stage/*.exe
          stage/*.zip
        if-no-files-found: error
  android:
    if: ${{ inputs.include_mobile }}
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - name: The pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Clovercut $version for ${{ matrix.target }}"
      - uses: taiki-e/cache-cargo-install-action@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7
        with:
          tool: cargo-apk

      - name: System libraries
        timeout-minutes: 5
        run: |
          sudo sed -i 's/#\$nrconf{restart} = .*/$nrconf{restart} = "a";/g' /etc/needrestart/needrestart.conf 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake libclang-dev

      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src/vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh ${{ matrix.target }}
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src/vendor/ffmpeg/${{ matrix.target }}
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: src/scripts/sherpa-mobile.sh ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src
          key: ${{ matrix.target }}

      - name: A key for the run
        run: |
          set -euo pipefail
          keystore=$RUNNER_TEMP/run.keystore
          keytool -genkeypair -v -keystore "$keystore" -storepass clovercut -keypass clovercut \
            -alias clovercut -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Clovercut, O=Clovercut" >/dev/null 2>&1
          echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=clovercut" >> "$GITHUB_ENV"

      - name: Memory headroom for Android compilation
        run: |
          set -euo pipefail
          # A prior runner received SIGTERM; its logs did not establish OOM.
          # Make swap provisioning explicit and retain memory diagnostics.
          sudo fallocate -l 10G /swapfile-clovercut-android
          sudo chmod 600 /swapfile-clovercut-android
          sudo mkswap /swapfile-clovercut-android
          sudo swapon /swapfile-clovercut-android
          free -h
          swapon --show

      - name: Bound Android release UI compilation
        working-directory: src
        run: |
          set -euo pipefail
          # Keep the engine at release opt-level 3; bound the generated
          # Slint module and avoid whole-program release LTO on the runner.
          cat >> .cargo/config.toml <<'EOF'
          [profile.release]
          lto = false
          codegen-units = 16
          [profile.release.package.concat]
          opt-level = 0
          codegen-units = 16
          EOF

      - name: Build the APK
        timeout-minutes: 70
        working-directory: src
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          set -euo pipefail
          eval "$(scripts/mobile-env.sh ${{ matrix.target }})"
          /usr/bin/time -v cargo apk build --release -p concat-android --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Android build diagnostics (failure only)
        if: failure()
        run: |
          free -h
          swapon --show
          if [ -f src/build.log ]; then
            {
              echo "### Android build failed"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve Android build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-arm64-build-log
          path: src/build.log
          if-no-files-found: ignore

      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir stage
          if [ -f src/target/release/apk/Clovercut.apk ]; then
            cp src/target/release/apk/Clovercut.apk "stage/Clovercut-$VERSION-android-${{ matrix.abi }}.apk"
          else
            cp src/target/release/apk/Concat.apk "stage/Clovercut-$VERSION-android-${{ matrix.abi }}.apk"
          fi
          ls -l stage

      - name: Verify Android libraries support 16 KB pages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/ci/check-16k-pages.py "stage/Clovercut-$VERSION-android-${{ matrix.abi }}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Clovercut-android-${{ matrix.abi }}
          path: stage/Clovercut-*-android-${{ matrix.abi }}.apk
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.run_macos == 'true'
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos_matrix) }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      ORT_INTEL_MAC_VERSION: 1.23.2
      GGML_AVX2: 'OFF'
      GGML_FMA: 'OFF'
      GGML_F16C: 'OFF'
      GGML_BMI2: 'OFF'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref }}
    - name: The pinned toolchain
      id: toolchain
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
    - name: Read the version
      id: version
      shell: bash
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Building Clovercut $version for ${{ matrix.target }}"
    - name: Minimum-OS gate regressions
      run: python3 -m unittest discover -s scripts -p test_macos_packaging.py -v
    - name: Media build tools (macOS)
      run: brew install cmake dylibbundler meson ninja nasm pkgconf
    - name: Pinned media source fingerprint
      id: media-source
      shell: bash
      run: |
        digest=$(awk '$1 ~ /^macos-source-/ {print}' scripts/ci/deps.lock | shasum -a 256 | cut -d ' ' -f 1)
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Monterey media runtime (restore)
      id: macos-media
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: src/vendor/macos-media/${{ matrix.target }}
        key: macos-media-12-${{ matrix.target }}-${{ hashFiles('scripts/build-macos-media.sh') }}-${{ steps.media-source.outputs.digest }}
    - name: Build pinned media runtime for macOS 12
      if: steps.macos-media.outputs.cache-hit != 'true'
      timeout-minutes: 60
      run: |
        scripts/build-macos-media.sh ${{ matrix.target }} "src/vendor/macos-media/${{ matrix.target }}"
        test -f "src/vendor/macos-media/${{ matrix.target }}/.clovercut-media-complete"
    - name: Keep media configure diagnostics
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: media-configure-${{ matrix.target }}
        retention-days: 14
        if-no-files-found: ignore
        path: src/vendor/macos-media/${{ matrix.target }}/share/build-failure/
    - name: Validate media runtime and codecs
      run: |
        set -euo pipefail
        prefix="$PWD/src/vendor/macos-media/${{ matrix.target }}"
        test -f "$prefix/.clovercut-media-complete"
        scripts/ci/check-min-os.sh "$prefix" "$MACOSX_DEPLOYMENT_TARGET" --enforce
        python3 scripts/ci/smoke-macos-media.py "$prefix"
    - name: Monterey media runtime (save)
      if: steps.macos-media.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: src/vendor/macos-media/${{ matrix.target }}
        key: ${{ steps.macos-media.outputs.cache-primary-key }}
    - name: FFmpeg development libraries (macOS)
      run: |
        echo "FFMPEG_DIR=$PWD/src/vendor/macos-media/${{ matrix.target }}" >> "$GITHUB_ENV"
        # ggml's Metal code asks `@available(macOS 15, *)` before using
        # residency sets. Below that deployment target the question is
        # answered at run time by ___isPlatformVersionAtLeast, which lives
        # in clang's compiler-rt - and rustc links with -nodefaultlibs, so
        # nothing pulls that archive in. Name it on the link line. (A
        # build on a developer's Mac never sees this: with no deployment
        # target set, the check is folded away at compile time.)
        echo "RUSTFLAGS=-C link-arg=$(xcrun clang --print-file-name=libclang_rt.osx.a)" >> "$GITHUB_ENV"
    - name: ONNX Runtime (Intel macOS)
      if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
      run: |
        set -euo pipefail
        stem="onnxruntime-osx-x86_64-$ORT_INTEL_MAC_VERSION"
        scripts/ci/fetch.sh onnxruntime-osx-x86_64 onnxruntime.tgz
        tar -xzf onnxruntime.tgz
        test -f "$stem/lib/libonnxruntime.$ORT_INTEL_MAC_VERSION.dylib"
        echo "ORT_MAC_DYLIB=$PWD/$stem/lib/libonnxruntime.$ORT_INTEL_MAC_VERSION.dylib" >> "$GITHUB_ENV"
    - name: sherpa-onnx static libraries (macOS and Linux)
      if: matrix.platform != 'windows'
      shell: bash
      run: |
        set -euo pipefail
        version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
        name="sherpa-onnx-${{ matrix.sherpa }}-static-lib"
        case "$(scripts/ci/fetch.sh --url "$name")" in
          */v"$version"/*) ;;
          *) echo "scripts/ci/deps.lock pins $name for another version than Cargo.lock's $version" >&2; exit 1 ;;
        esac
        stem="sherpa-onnx-v$version-${{ matrix.sherpa }}-static-lib"
        scripts/ci/fetch.sh "$name" sherpa.tar.bz2
        mkdir -p sherpa
        tar -xjf sherpa.tar.bz2 -C sherpa
        test -d "sherpa/$stem/lib"
        echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: src
        cache-on-failure: true
        key: ${{ matrix.target }}
        env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT
    - name: Build
      timeout-minutes: 120
      shell: bash
      working-directory: src
      run: |
        set -o pipefail
        cargo build --locked --profile app -p concat --bin clovercut --target ${{ matrix.target }} \
          --config 'profile.app.lto=false' \
          --config 'profile.app.package.concat.opt-level=0' \
          --config 'profile.app.package.concat.codegen-units=16' 2>&1 | tee build.log
    - name: Build log to the summary (failure only)
      if: failure()
      shell: bash
      run: |
        if [ -f src/build.log ]; then
          {
            echo "### Build failed: ${{ matrix.target }}"
            echo '```'
            tail -n 150 src/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Bundle (macOS)
      if: matrix.platform == 'macos'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        app=Clovercut.app
        rm -rf "$app"
        mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
        cp LICENSE THIRD_PARTY_NOTICES.md "$app/Contents/Resources/"
        cp "src/target/${{ matrix.target }}/app/clovercut" "$app/Contents/MacOS/clovercut"

        # The icon set Apple wants: each size and its @2x twin.
        iconset=Clovercut.iconset
        rm -rf "$iconset"; mkdir "$iconset"
        icons=assets/icons
        cp "$icons/clovercut_16.png"  "$iconset/icon_16x16.png"
        cp "$icons/clovercut_32.png"  "$iconset/icon_16x16@2x.png"
        cp "$icons/clovercut_32.png"  "$iconset/icon_32x32.png"
        cp "$icons/clovercut_64.png"  "$iconset/icon_32x32@2x.png"
        cp "$icons/clovercut_128.png" "$iconset/icon_128x128.png"
        cp "$icons/clovercut_256.png" "$iconset/icon_128x128@2x.png"
        cp "$icons/clovercut_256.png" "$iconset/icon_256x256.png"
        cp "$icons/clovercut_512.png" "$iconset/icon_256x256@2x.png"
        cp "$icons/clovercut_512.png" "$iconset/icon_512x512.png"
        iconutil -c icns "$iconset" -o "$app/Contents/Resources/Clovercut.icns"

        cat > "$app/Contents/Info.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key><string>Clovercut</string>
          <key>CFBundleDisplayName</key><string>Clovercut</string>
          <key>CFBundleIdentifier</key><string>io.github.tulcoturo.clovercut</string>
          <key>CFBundleVersion</key><string>${VERSION}</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>CFBundleExecutable</key><string>clovercut</string>
          <key>CFBundleIconFile</key><string>Clovercut</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>${MACOSX_DEPLOYMENT_TARGET}</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          <key>LSApplicationCategoryType</key><string>public.app-category.video</string>
          <key>NSHumanReadableCopyright</key><string>AGPL-3.0-or-later. See THIRD_PARTY_NOTICES.md.</string>
          <key>NSMicrophoneUsageDescription</key><string>Clovercut records voiceovers from your microphone.</string>
        </dict>
        </plist>
        PLIST

        # Every non-system dylib the binary (and those dylibs) load, copied
        # in and re-pointed at @executable_path/../Frameworks.
        dylibbundler -od -b \
          -x "$app/Contents/MacOS/clovercut" \
          -d "$app/Contents/Frameworks" \
          -p @executable_path/../Frameworks

        # Nothing outside the bundle may remain: a load path into
        # Homebrew would break on a Mac without it.
        if otool -L "$app/Contents/MacOS/clovercut" | grep -E '/opt/homebrew|/usr/local' ; then
          echo "the binary still loads libraries from outside the bundle" >&2
          exit 1
        fi

        # ONNX Runtime is never linked at launch: on an Intel Mac it is
        # loaded at first use from Frameworks, under the name the app
        # looks for (concat-vision's onnx.rs), and on Apple silicon it is
        # inside the binary. A link here is #333 back: the app closing at
        # launch on every macOS older than the runtime.
        if otool -L "$app/Contents/MacOS/clovercut" | grep libonnxruntime ; then
          echo "the binary links ONNX Runtime at launch" >&2
          exit 1
        fi
        lazy=()
        if [ -n "${ORT_MAC_DYLIB:-}" ]; then
          cp "$ORT_MAC_DYLIB" "$app/Contents/Frameworks/libonnxruntime.dylib"
          lazy=(--lazy Contents/Frameworks/libonnxruntime.dylib)
        fi

        # All eagerly loaded libraries must honour Monterey, not just the app.
        # Only the runtime guarded at first use retains its separate minimum.
        scripts/ci/check-min-os.sh "$app" "$MACOSX_DEPLOYMENT_TARGET" --enforce ${lazy[@]+"${lazy[@]}"}
        cp -R "$FFMPEG_DIR/share/licenses" "$app/Contents/Resources/MediaLicenses"
        cp "$FFMPEG_DIR/share/media-sources.lock" "$FFMPEG_DIR/share/media-build.txt" "$app/Contents/Resources/"
    - name: Sign and notarise (macOS)
      if: matrix.platform == 'macos'
      env:
        CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        app=Clovercut.app
        dmg="Clovercut-${VERSION}-macos-${{ matrix.arch }}.dmg"
        if [ -n "${CERT_P12}" ] && [ -n "${IDENTITY}" ]; then
          keychain=$RUNNER_TEMP/signing.keychain-db
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          # Frameworks first, then the executable, then the bundle: each
          # signature covers what is beneath it.
          find "$app/Contents/Frameworks" -name '*.dylib' -exec \
            codesign --force --options runtime --timestamp -s "$IDENTITY" {} \;
          # The hardened runtime keeps the microphone shut unless the app
          # says it records: the voiceover.
          entitlements="$RUNNER_TEMP/concat.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>com.apple.security.device.audio-input</key><true/></dict></plist>' \
            > "$entitlements"
          codesign --force --options runtime --timestamp --entitlements "$entitlements" -s "$IDENTITY" "$app/Contents/MacOS/clovercut"
          codesign --force --options runtime --timestamp --entitlements "$entitlements" -s "$IDENTITY" "$app"
          codesign --verify --deep --strict "$app"
        else
          echo "No signing identity: ad-hoc signing."
          codesign --force --deep -s - "$app"
        fi

        # Signing / filesystem indexing can briefly leave the source busy.
        # Retry only that transient failure, preserving other packaging errors.
        for attempt in 1 2 3 4; do
          if hdiutil create -volname Clovercut -srcfolder "$app" -ov -format UDZO "$dmg" > dmg-create.log 2>&1; then
            cat dmg-create.log
            break
          else
            status=$?
            cat dmg-create.log >&2
            if ! grep -qi 'Resource busy' dmg-create.log || [ "$attempt" -eq 4 ]; then
              exit "$status"
            fi
            sleep 5
          fi
        done
        test -s "$dmg"

        if [ -n "${APPLE_ID}" ] && [ -n "${TEAM_ID}" ] && [ -n "${APP_PASSWORD}" ] && [ -n "${IDENTITY}" ]; then
          codesign --force --timestamp -s "$IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
        fi
        mkdir -p stage && mv "$dmg" stage/
    - name: Smoke test (macOS)
      if: matrix.platform == 'macos'
      timeout-minutes: 10
      run: scripts/ci/smoke-macos.sh Clovercut.app
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: Clovercut-macos-${{ matrix.arch }}
        path: stage/*.dmg
        if-no-files-found: error
