name: macOS media toolchain probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare default and explicit host SDK configuration
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh macos-source-ffmpeg ffmpeg.tar.xz
          mkdir ffmpeg
          tar -xf ffmpeg.tar.xz -C ffmpeg --strip-components=1
          compiler=$(xcrun --find clang)
          flags="-O2 -fPIC -mmacosx-version-min=12.0 -isysroot $(xcrun --sdk macosx --show-sdk-path) -Werror=unguarded-availability-new"
          for mode in default-host explicit-host-sdk; do
            mkdir "$mode"
            (
              cd "$mode"
              extra=()
              if [ "$mode" = explicit-host-sdk ]; then
                extra=("--host-cc=$compiler" "--host-cflags=$flags" "--host-ldflags=$flags")
              fi
              ../ffmpeg/configure --cc="$compiler" --cxx="$(xcrun --find clang++)" \
                --extra-cflags="$flags" --extra-cxxflags="$flags" --extra-ldflags="$flags" \
                --disable-everything --disable-autodetect --disable-programs --disable-doc \
                --disable-x86asm --disable-metal ${extra[@]+"${extra[@]}"}
            ) && result=0 || result=$?
            echo "$mode exit=$result"
            if [ "$result" -ne 0 ]; then tail -100 "$mode/ffbuild/config.log"; fi
            if [ "$mode" = explicit-host-sdk ]; then exit "$result"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-toolchain-${{ matrix.os }}
          retention-days: 14
          path: '*/ffbuild/config.log'
