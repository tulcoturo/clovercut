name: Headless quality checks

# Editing/document regressions do not need to compile the graphical application.
# This complements the full release CI; it does not replace it.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source ref (empty uses the selected branch)
        type: string
        default: ""
  push:
    paths:
      - '.github/workflows/headless-quality.yml'
      - 'scripts/ci_timings.py'
      - 'scripts/check_project_io.py'
      - 'src/crates/concat-host/src/projects.rs'
      - 'scripts/test_ci_timings.py'
      - 'scripts/performance_report.py'
      - 'scripts/test_performance_report.py'
      - 'src/crates/concat/src/enhance_plan.rs'
      - 'src/crates/concat/src/performance_metrics.rs'
      - 'src/crates/concat/src/relink_search.rs'
      - 'src/crates/concat/src/owned_audio.rs'
      - 'src/crates/concat/src/request_owner.rs'
      - 'src/crates/concat/src/panes/captions.rs'
      - 'src/crates/concat/src/panes/speech.rs'
      - 'src/crates/concat/src/panes/sounds.rs'
      - 'src/crates/concat/src/panes/relink.rs'
      - 'src/crates/concat/src/phase6_performance_tests.rs'
      - 'src/crates/concat-core/**'
      - 'src/crates/concat-project/**'
      - 'src/Cargo.toml'
      - 'src/Cargo.lock'
      - 'src/rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/workflows/headless-quality.yml'
      - 'scripts/ci_timings.py'
      - 'scripts/check_project_io.py'
      - 'src/crates/concat-host/src/projects.rs'
      - 'scripts/test_ci_timings.py'
      - 'scripts/performance_report.py'
      - 'scripts/test_performance_report.py'
      - 'src/crates/concat/src/enhance_plan.rs'
      - 'src/crates/concat/src/performance_metrics.rs'
      - 'src/crates/concat/src/relink_search.rs'
      - 'src/crates/concat/src/owned_audio.rs'
      - 'src/crates/concat/src/request_owner.rs'
      - 'src/crates/concat/src/panes/captions.rs'
      - 'src/crates/concat/src/panes/speech.rs'
      - 'src/crates/concat/src/panes/sounds.rs'
      - 'src/crates/concat/src/panes/relink.rs'
      - 'src/crates/concat/src/phase6_performance_tests.rs'
      - 'src/crates/concat-core/**'
      - 'src/crates/concat-project/**'
      - 'src/Cargo.toml'
      - 'src/Cargo.lock'
      - 'src/rust-toolchain.toml'

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Structured report regressions
        run: |
          python3 -m unittest discover -s scripts -p test_ci_timings.py -v
          python3 -m unittest discover -s scripts -p test_performance_report.py -v
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          shared-key: headless-project
      - name: Enhance request and estimate planning regressions
        working-directory: src
        run: |
          clippy-driver --edition 2024 --test -D warnings crates/concat/src/enhance_plan.rs -o /tmp/clovercut-enhance-plan-tests
          /tmp/clovercut-enhance-plan-tests
      - name: Pure performance measurement regressions
        working-directory: src
        run: |
          rustc --edition 2024 --test -D warnings crates/concat/src/performance_metrics.rs -o /tmp/clovercut-performance-metrics-tests
          /tmp/clovercut-performance-metrics-tests
      - name: Missing-media search regressions
        working-directory: src
        run: |
          clippy-driver --edition 2024 --test -D warnings crates/concat/src/relink_search.rs -o /tmp/clovercut-relink-search-tests
          /tmp/clovercut-relink-search-tests
      - name: Owned audio identity regressions
        working-directory: src
        run: |
          clippy-driver --edition 2024 --test -D warnings crates/concat/src/owned_audio.rs -o /tmp/clovercut-owned-audio-tests
          /tmp/clovercut-owned-audio-tests
      - name: Background request ownership regressions
        working-directory: src
        run: |
          clippy-driver --edition 2024 --test -D warnings crates/concat/src/request_owner.rs -o /tmp/clovercut-request-owner-tests
          /tmp/clovercut-request-owner-tests
      - name: Lint editing and document logic
        working-directory: src
        run: cargo clippy --locked -p concat-core -p concat-project --all-targets -- -D warnings
      - name: Project persistence regressions without native media dependencies
        run: python3 scripts/check_project_io.py
      - name: Editing and document regressions
        working-directory: src
        run: cargo test --locked -p concat-core -p concat-project
