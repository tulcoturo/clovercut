name: CI
run-name: ${{ inputs.connector_only && 'Audio connector checks' || inputs.desktop_qa && 'Full CI with virtual desktop checks' || 'Full CI' }} · ${{ inputs.ref || github.ref_name }}

# Run the full engine checks manually or when preparing a release.
# Ordinary pushes and pull requests do not start this graphical build.
# headless-quality.yml checks editing/document changes without compiling the UI.
#
# Every action is pinned to a commit, with the tag it was in a comment
# beside it: a tag can be moved to other code after a run has trusted it,
# a commit cannot. Dependabot proposes the bumps (.github/dependabot.yml).
# The prebuilt libraries the jobs download are pinned the same way, by
# digest, in scripts/ci/deps.lock.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source ref to validate (empty uses the selected branch)
        type: string
        default: ""
      connector_only:
        description: Check only the bundled audio connector (no Rust compilation)
        type: boolean
        default: false
      desktop_qa:
        description: Also run the selected ignored desktop regressions with virtual display/audio
        type: boolean
        default: false
  # release.yml runs this before it builds anything: a tag on a red tree
  # is not a release. It names the tag, because a release started by hand
  # runs on main, and main is not what it builds.
  workflow_call:
    inputs:
      ref:
        description: The ref to test, when it is not the one this runs on
        type: string
        default: ""

# Manual checks and release checks keep independent source refs.
concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.connector_only && 'connector' || 'full' }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  connector:
    name: Audio connector regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Catalogue, session and Studio preview regressions
        # Direct execution uses node:test and propagates assertion failures.
        # Uses fixtures and loopback HTTP; no browser, credentials or external service.
        run: |
          for file in src/crates/concat-host/audio-service/test/*.test.mjs; do
            node "$file"
          done
  engine:
    # This selector is dispatch-only: reusable release calls cannot pass it.
    # They always run the engine as well as the connector.
    if: inputs.connector_only != true
    name: Engine tests and lints
    runs-on: ubuntu-24.04
    # A cold native + Slint test build needs more than 25 minutes on a hosted runner.
    # Keep separate compile and execution budgets so a slow build is identifiable.
    timeout-minutes: 180
    env:
      # See build-app.yml: the version the ort crate is built against.
      # scripts/ci/deps.lock pins the file.
      ORT_VERSION: 1.28.0
      # Use the same settings for linting, compiling and running tests.
      # Changing debug settings between steps rebuilds the dependency graph.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The toolchain src/rust-toolchain.toml pins, installed by name: every
      # cargo command below runs from src/, where the pin applies, so a
      # stable installed here would only be fetched and left.
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      # cargo-nextest runs the tests: each in a process of its own, with a
      # timeout per test and a JUnit report. See src/.config/nextest.toml.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # Saved even when the job fails: a cache saved only by a green run
      # is never saved while the job is red, and every red run then
      # compiles from nothing.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          cache-on-failure: true

      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen needs libclang; whisper.cpp is built by cmake; the
      # file dialogs link GTK on Linux. Mesa's Vulkan drivers bring
      # lavapipe, a software GPU, so the compositor's parity suite runs
      # here rather than skipping for want of an adapter.
      # Hosted apt mirrors can take longer than five minutes to fetch LLVM.
      - name: System libraries
        timeout-minutes: 15
        run: |
          sudo sed -i 's/#\$nrconf{restart} = .*/$nrconf{restart} = "a";/g' /etc/needrestart/needrestart.conf 2>/dev/null || true
          # The Azure mirror stalled twice while downloading LLVM/Mesa. Use
          # Ubuntu's official archive; apt still verifies signed repositories.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in paths:
              if path.is_file():
                  text = path.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      path.write_text(updated)
          PYTHON
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake \
            libvulkan1 mesa-vulkan-drivers

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs, so the
      # libraries come from BtbN, and FFMPEG_DIR tells the bindings where.
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh ffmpeg-linux64 ffmpeg.tar.xz
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "$PWD/ffmpeg-dev/bin" >> "$GITHUB_PATH"
          # Integration tests invoke both FFmpeg executables, not just libav*.
          test -x ffmpeg-dev/bin/ffmpeg
          test -x ffmpeg-dev/bin/ffprobe

      # ONNX Runtime as a shared library, linked dynamically, for the reason
      # build-app.yml gives: a static one beside sherpa-onnx's is the same
      # protobuf twice, and the test binary does not link. The tests then
      # find it through LD_LIBRARY_PATH, as they find FFmpeg.
      - name: ONNX Runtime
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          scripts/ci/fetch.sh onnxruntime-linux-x64 onnxruntime.tgz
          tar -xzf onnxruntime.tgz
          test -f "$stem/lib/libonnxruntime.so.$ORT_VERSION"
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/$stem/lib"
          } >> "$GITHUB_ENV"

      # The prebuilt sherpa-onnx library, fetched here as the platform jobs
      # below fetch theirs. Left to its own build script, sherpa-onnx-sys
      # unpacks it into target/sherpa-onnx-prebuilt, which rust-cache does
      # not keep while the build script's run is kept: a cache hit then
      # links against a folder that is not there. The version is the
      # lockfile's, and deps.lock must pin that version's file.
      - name: sherpa-onnx libraries
        run: |
          set -euo pipefail
          version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          name=sherpa-onnx-linux-x64-static-lib
          case "$(scripts/ci/fetch.sh --url "$name")" in
            */v"$version"/*) ;;
            *) echo "scripts/ci/deps.lock pins $name for another version than Cargo.lock's $version" >&2; exit 1 ;;
          esac
          stem="sherpa-onnx-v$version-linux-x64-static-lib"
          scripts/ci/fetch.sh "$name" sherpa.tar.bz2
          mkdir -p sherpa
          tar -xjf sherpa.tar.bz2 -C sherpa
          test -d "sherpa/$stem/lib"
          echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"

      - run: cargo fmt --check
        working-directory: src
      # Every string the interface shows is a key in a locale file; this
      # keeps en.json the inventory of them and every shipped language
      # keyed off it. See TRANSLATING.md.
      - run: python3 -m unittest discover -s scripts -p test_locales.py
      - run: python3 scripts/locales.py --check --strict
      # The models Concat downloads are mirrored onto a release of this
      # repository; models/manifest.toml is what fills that mirror and the
      # engine's tables are what a download is checked against. This keeps
      # the two saying the same thing. See models/manifest.toml.
      - run: python3 scripts/models.py --check
      # -D warnings covers rustc lints too (missing_docs among them), so a
      # public item without documentation fails here, not in review. Lints
      # before tests: they finish in a fraction of the time and catch the
      # most.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 45
        working-directory: src

      # The tests are compiled in a step of their own, so a slow compile
      # and a slow test are told apart by which step ran out of time. One
      # job at a time and no debug info, to stay inside the runner's
      # memory; the run below finds everything already built.
      - name: Build the tests
        timeout-minutes: 75
        working-directory: src
        run: cargo nextest run --locked --workspace --no-run --build-jobs 1
      # CONCAT_REQUIRE_GPU: the GPU tests fail rather than skip when no
      # adapter is usable, so the parity suite is known to have run. The
      # report and the log are kept when it fails (the last step).
      - name: Run the tests
        timeout-minutes: 20
        working-directory: src
        env:
          CONCAT_REQUIRE_GPU: "1"
        run: |
          set -o pipefail
          status=0
          cargo nextest run --locked --workspace --build-jobs 1 --profile ci 2>&1 | tee nextest-workspace.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-workspace.xml 2>/dev/null || true
          exit "$status"
      # nextest does not run the examples in the documentation; cargo does.
      - name: Run the documentation's examples
        timeout-minutes: 10
        working-directory: src
        run: cargo test --workspace --doc -j 1
      # The gRPC transport is a feature nothing else in the workspace turns
      # on, so it is linted and tested here on its own. See concat-server.
      - run: cargo clippy -p concat-server -p concat-cli --features grpc --all-targets -- -D warnings
        timeout-minutes: 10
        working-directory: src
      - name: Run the gRPC tests
        timeout-minutes: 10
        working-directory: src
        run: |
          set -o pipefail
          status=0
          cargo nextest run -p concat-server --features grpc --profile ci 2>&1 | tee nextest-grpc.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-grpc.xml 2>/dev/null || true
          exit "$status"

      - name: Virtual desktop prerequisites (isolated runner only)
        if: inputs.desktop_qa && !inputs.connector_only
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth pulseaudio pulseaudio-utils libasound2-plugins vulkan-tools
      - name: Selected desktop regressions with virtual display and audio
        if: inputs.desktop_qa && !inputs.connector_only
        timeout-minutes: 30
        working-directory: src
        run: |
          set -euo pipefail
          qa_root=$(mktemp -d)
          export XDG_RUNTIME_DIR="$qa_root/runtime"
          export XDG_CONFIG_HOME="$qa_root/config"
          export XDG_DATA_HOME="$qa_root/data"
          export XDG_CACHE_HOME="$qa_root/cache"
          export XDG_STATE_HOME="$qa_root/state"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          trap 'pulseaudio --kill || true; rm -rf "$qa_root"' EXIT
          pulseaudio --start --exit-idle-time=-1 --load='module-null-sink sink_name=clovercut_qa'
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
          export PULSE_COOKIE="$XDG_CONFIG_HOME/pulse/cookie"
          pactl set-default-sink clovercut_qa
          export ALSA_CONFIG_PATH="$qa_root/asound.conf"
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > "$ALSA_CONFIG_PATH"
          export CONCAT_GPU=software
          status=0
          xvfb-run -a -s '-screen 0 1920x1080x24' bash -euo pipefail -c '
            rustc --version
            vulkaninfo --summary
            pactl info
            cargo nextest run --locked -p concat --lib --profile ci --build-jobs 1 \
              --test-threads 1 --run-ignored only \
              -E "test(phase3_timeline_tests::) | test(phase4_) | test(new_project_library_and_timeline_playback) | test(committed_warning_preserves_edits_and_allows_close) | test(switch_and_shutdown_with_running_work) | test(clipboard_tests::)"
          ' 2>&1 | tee nextest-desktop.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-desktop.xml 2>/dev/null || true
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('target/nextest/ci/junit-desktop.xml').findall('.//testcase')
          assert len(cases) >= 12, f'Expected the 12 selected desktop cases, got {len(cases)}'
          assert not any(case.find('skipped') is not None for case in cases), 'Selected desktop cases were skipped'
          PY

      - name: Keep test results and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-linux
          retention-days: 14
          path: |
            src/target/nextest/ci/*.xml
            src/nextest-*.log
          if-no-files-found: ignore
