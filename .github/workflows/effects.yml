name: Visual effect quality checks

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/effects.yml'
      - 'scripts/check_creative_effects.py'
      - 'scripts/fixtures/creative-effects/**'
      - 'src/crates/concat-effects/**'
      - 'src/crates/concat-render/**'
      - 'src/crates/concat-core/**'
      - 'src/Cargo.toml'
      - 'src/Cargo.lock'
      - 'src/rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/effects.yml'
      - 'scripts/check_creative_effects.py'
      - 'scripts/fixtures/creative-effects/**'
      - 'src/crates/concat-effects/**'
      - 'src/crates/concat-render/**'
      - 'src/crates/concat-core/**'
      - 'src/Cargo.toml'
      - 'src/Cargo.lock'
      - 'src/rust-toolchain.toml'

permissions:
  contents: read

jobs:
  effects:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CONCAT_GPU: software
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          shared-key: visual-effects
          cache-on-failure: true
      - name: Software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in paths:
              if path.is_file():
                  text = path.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      path.write_text(updated)
          PYTHON
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: Package contracts and shader validation
        working-directory: src
        run: |
          cargo clippy --locked -p concat-effects --all-targets -- -D warnings
          cargo test --locked -p concat-effects
      - name: Render creative effects and verify spatial, alpha and time behavior
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then export XDG_RUNTIME_DIR=$(mktemp -d); fi
          python3 scripts/check_creative_effects.py --output effect-previews 2>&1 | tee effect-checks.log
      - name: Keep actual shader renders and check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: creative-effect-evidence-${{ runner.os }}
          retention-days: 14
          path: |
            effect-previews/*.ppm
            effect-checks.log
