# A version tag publishes tested desktop packages for Linux, Windows and macOS.
name: Clovercut release
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, e.g. v0.0.2
        required: true
      ref:
        description: Full commit SHA, branch or tag to prepare (empty builds the existing tag)
        required: false
        default: ''
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
    - name: The tag is a version tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::'$TAG' is not a version tag (v1.2.3, or v1.2.3-alpha.1)"
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || inputs.tag || github.ref }}
    - id: tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        tag="$TAG"
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
        # The tag is the version, or the version with a pre-release
        # suffix: v0.2.1 and v0.2.1-alpha.22 both belong to 0.2.1.
        case "$tag" in
          "v$version" | "v$version-"*) ;;
          *)
            echo "tag $tag does not match src/Cargo.toml version $version" >&2
            exit 1
            ;;
        esac
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        # The bundles are named for the version, not the tag: v0.2.1 and
        # v0.2.1-alpha.22 both produce Clovercut-0.2.1-* files.
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  engine:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check.outputs.commit }}
      desktop_qa: true
  headless:
    name: Desktop UI and document checks
    needs: check
    uses: ./.github/workflows/headless-quality.yml
    with:
      ref: ${{ needs.check.outputs.commit }}
  effects:
    name: Visual effects and Windows software adapter
    needs: check
    uses: ./.github/workflows/effects.yml
    with:
      ref: ${{ needs.check.outputs.commit }}
  packaging:
    name: Linux package regressions
    needs: check
    uses: ./.github/workflows/linux-packaging.yml
    with:
      ref: ${{ needs.check.outputs.commit }}
  build:
    needs: check
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ needs.check.outputs.commit }}
      include_mobile: false
  publish:
    name: Publish release
    needs:
    - check
    - engine
    - effects
    - headless
    - packaging
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: bundles
        pattern: Clovercut-*
        merge-multiple: true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.check.outputs.commit }}
        fetch-depth: 0
        path: source
    - name: Write the manifest
      env:
        VERSION: ${{ needs.check.outputs.version }}
        TAG: ${{ needs.check.outputs.tag }}
      run: |
        set -euo pipefail
        python3 source/scripts/models.py release-manifest \
          --version "$VERSION" \
          --tag "$TAG" \
          --bundles bundles \
          --out bundles/manifest.json
        cat bundles/manifest.json
    - name: Checksums
      env:
        VERSION: ${{ needs.check.outputs.version }}
      run: |
        set -euo pipefail
        cd bundles
        ls -l
        expected=(
          "Clovercut-${VERSION}-x86_64.AppImage"
          "Clovercut-${VERSION}-aarch64.AppImage"
          "Clovercut-${VERSION}-x86_64.deb"
          "Clovercut-${VERSION}-aarch64.deb"
          "Clovercut-${VERSION}-x86_64.rpm"
          "Clovercut-${VERSION}-aarch64.rpm"
          "Clovercut-${VERSION}-windows-x86_64-setup.exe"
          "Clovercut-${VERSION}-windows-x86_64-portable.zip"
        )
        expected+=(
          "Clovercut-${VERSION}-windows-aarch64-setup.exe"
          "Clovercut-${VERSION}-windows-aarch64-portable.zip"
          "Clovercut-${VERSION}-macos-arm64.dmg"
          "Clovercut-${VERSION}-macos-x86_64.dmg"
        )
        if find . -type f \( -name '*.apk' -o -name '*.ipa' \) | grep -q .; then
          echo "::error::Mobile packages are excluded from this desktop release"
          exit 1
        fi
        for file in "${expected[@]}"; do test -s "$file"; done
        sha256sum -- "${expected[@]}" manifest.json > SHA256SUMS
    - name: Write the notes
      env:
        VERSION: ${{ needs.check.outputs.version }}
      run: |
        set -euo pipefail
        cp "source/docs/releases/${VERSION}.md" "$RUNNER_TEMP/notes.md"
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        tag_name: ${{ needs.check.outputs.tag }}
        target_commitish: ${{ needs.check.outputs.commit }}
        name: Clovercut ${{ needs.check.outputs.tag }}
        draft: false
        prerelease: ${{ contains(needs.check.outputs.tag, '-') }}
        body_path: ${{ runner.temp }}/notes.md
        fail_on_unmatched_files: true
        files: bundles/*
